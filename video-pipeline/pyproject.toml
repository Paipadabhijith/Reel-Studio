[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-pipeline"
version = "0.1.0"
description = "Automated video pipeline: Reels and long-form from a script and a recorded voice"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "filelock>=3.13",
  "httpx>=0.27",
  "rapidfuzz>=3.6",
  "librosa>=0.10",
  "numpy",
  "indic-transliteration>=2.3",
  "anthropic>=1.9",
  "trafilatura>=2.0",
  "yt-dlp>=2025.1",
  "matplotlib>=3.8",
  "flask>=3.0",
  "shapely>=2.0",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reel = "scripts.cli:app"

[tool.setuptools]
packages = ["scripts", "scripts.lib"]

[tool.setuptools.package-data]
scripts = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
